<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PS99 World Cup II Tracker</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script>
    (function(){
        var V = 2;
        var k = '_ps99wc2v';
        var stored = localStorage.getItem(k);
        localStorage.setItem(k, V);
        if (stored && stored !== String(V)) {
            var url = location.href.split('?')[0] + '?nocache=' + V;
            location.replace(url);
        }
    })();
    </script>
</head>
<body>

<header>
    <div class="header-content">
        <div class="logo">
            <span class="logo-icon">🏆</span>
            <h1>PS99 World Cup II</h1>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
            <span id="event-status-badge"></span>
            <button class="btn-refresh" id="refresh-btn">🔄 Refresh</button>
        </div>
    </div>
</header>

<main>

    <!-- ── Leaderboard ── -->
    <div id="leaderboard-view" class="view active">
        <div class="event-info-bar">
            <div>
                <div class="event-title">Top 200 Leaderboard</div>
                <div class="event-dates" id="event-dates">Live from the PS99 clan API</div>
            </div>
        </div>

        <div class="manage-card live-card">
            <div class="manage-card-header">
                <h3>🔍 Look Up Any Clan</h3>
                <span class="live-dot"></span>
            </div>
            <p class="live-desc">Search for any clan by exact name, even if it's ranked below #200.</p>
            <div class="live-manual">
                <input type="text" id="search-clan-name" class="live-input" placeholder="Enter clan name e.g. GODS">
                <button class="btn-live-secondary" id="search-clan-btn">Search</button>
            </div>
            <div id="search-status" class="import-status"></div>
        </div>

        <div id="outside-section" style="display:none">
            <h3 class="sub-heading">Found Outside Top 200</h3>
            <div id="outside-list" class="manage-clans-list"></div>
        </div>

        <h3 class="sub-heading">Top 200</h3>
        <div class="players-table-container">
            <table class="players-table">
                <thead>
                    <tr><th>#</th><th>Clan</th><th>Points</th></tr>
                </thead>
                <tbody id="leaderboard-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- ── Team Detail ── -->
    <div id="team-detail-view" class="view">
        <div class="detail-top-bar">
            <button class="back-btn" id="team-back-btn">← Back to Leaderboard</button>
        </div>
        <div class="team-detail-header" id="team-detail-header">
            <div class="team-detail-title-row">
                <div class="team-detail-color-bar" id="team-detail-color-bar"></div>
                <div>
                    <h2 id="team-detail-name"></h2>
                    <div id="team-detail-sub" class="team-detail-sub-line"></div>
                </div>
            </div>
            <div class="team-detail-stats">
                <div class="stat-box"><span class="stat-label">Rank</span><span class="stat-value" id="td-rank"></span></div>
                <div class="stat-box"><span class="stat-label">Points</span><span class="stat-value" id="td-pts"></span></div>
            </div>
        </div>
    </div>

</main>

<div id="toast" class="toast"></div>

<script src="app.js?v=2"></script>
</body>
</html>
