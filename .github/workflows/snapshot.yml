name: Snapshot Leagues Data

on:
  # Scheduling is handled by an external cron (Google Apps Script calling
  # workflow_dispatch) since GitHub's own `schedule:` trigger drifts badly at
  # 5-minute intervals. Keeping both caused overlapping dispatches close
  # enough together that GitHub cancelled queued-but-not-yet-started runs
  # before they ever executed — leaving history.json stale for many cycles
  # in a row. workflow_dispatch only, so every trigger actually gets to run.
  workflow_dispatch:
    inputs:
      test_discord_alert:
        description: 'Send a one-off test Discord alert and exit (skips the actual snapshot)'
        type: boolean
        default: false
      test_discord_group:
        description: 'Which monitor group to test (only used when test_discord_alert is checked)'
        type: choice
        options: ['all', 'group1 (DISCORD_WEBHOOK_URL)', 'group2 (DISCORD_WEBHOOK_URL_2)']
        default: 'all'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If a previous dispatch of this workflow is still running (e.g. it got
      # stuck waiting on a slow GitHub-hosted runner), don't queue behind it —
      # skip this cycle outright and let the next 10-min dispatch try fresh.
      # Queuing (the old `concurrency:` block's behavior) just let one stuck
      # run block every subsequent dispatch for its entire stuck duration,
      # turning one bad cycle into a cascading pile-up of missed snapshots.
      #
      # Only defer to an OLDER in-progress run (smaller run id). Deferring to
      # ANY in-progress run (including newer ones) is a livelock: if two runs
      # get a runner in the same instant, each one sees the other as "in
      # progress" and both skip, so the cycle silently records nothing. Only
      # ever yielding to something strictly older guarantees exactly one
      # survivor — the oldest run in any simultaneous batch always proceeds.
      - name: Skip if an older run is still in progress
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stopped early by explicit request (originally the cutoff was the
          # event's 2026-07-10 16:00 UTC end time, but the user asked to stop
          # right away instead of waiting). The external Apps Script cron
          # keeps dispatching every 10 minutes regardless — rather than
          # needing access to that cron (which is outside GitHub and this
          # workflow), just make every dispatch after this cutoff a no-op.
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-07-10T15:33:00Z' +%s)" ]; then
            echo "Snapshotting stopped by request (past 2026-07-10T15:33:00Z) — skipping this dispatch."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          other_ids=$(gh run list --repo "${{ github.repository }}" --workflow snapshot.yml --status in_progress --json databaseId --jq '.[].databaseId' | grep -v "^${{ github.run_id }}$" || true)
          proceed=true
          for id in $other_ids; do
            if [ "$id" -lt "${{ github.run_id }}" ]; then
              proceed=false
            fi
          done
          if [ "$proceed" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "An older snapshot run is still in progress (run id(s): $other_ids) — skipping this dispatch."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record and push snapshot (retries on conflict)
        if: steps.guard.outputs.proceed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          TEST_DISCORD_ALERT: ${{ github.event.inputs.test_discord_alert }}
          TEST_DISCORD_GROUP: ${{ github.event.inputs.test_discord_group }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            node .github/scripts/snapshot.mjs
            git add history.json resolved_names.json .github/monitor-data
            git diff --cached --quiet && exit 0
            git commit -m "chore: snapshot leagues data"
            git push && exit 0
            echo "Push rejected (another run pushed first) — discarding this attempt and retrying from the latest main"
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::Failed to push snapshot after 5 attempts"
          exit 1

      # A push made with the default GITHUB_TOKEN (like the commit above)
      # does not trigger other workflows — so deploy.yml's `on: push` never
      # fires for these commits. Deploy inline here instead, so every fresh
      # snapshot actually reaches the live site.
      - name: Setup Pages
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # deploy-pages occasionally fails with a transient "Deployment failed,
      # try again later" from GitHub's own backend, even though the artifact
      # upload above succeeded — leaving the live site stuck on the last
      # successful deploy despite newer data already being pushed. Retry a
      # couple of times against the same uploaded artifact before giving up.
      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.proceed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.guard.outputs.proceed == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (retry 1)
        if: steps.guard.outputs.proceed == 'true' && steps.deployment.outcome == 'failure'
        id: deployment_retry1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry 2
        if: steps.guard.outputs.proceed == 'true' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 2)
        if: steps.guard.outputs.proceed == 'true' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
