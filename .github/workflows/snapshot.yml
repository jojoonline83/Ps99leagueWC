name: Snapshot Leagues Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record and push snapshot (retries on conflict)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            node .github/scripts/snapshot.mjs
            git add history.json
            git diff --cached --quiet && exit 0
            git commit -m "chore: snapshot leagues data"
            git push && exit 0
            echo "Push rejected (another run pushed first) — discarding this attempt and retrying from the latest main"
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::Failed to push snapshot after 5 attempts"
          exit 1

      # A push made with the default GITHUB_TOKEN (like the commit above)
      # does not trigger other workflows — so deploy.yml's `on: push` never
      # fires for these commits. Deploy inline here instead, so every fresh
      # snapshot actually reaches the live site.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
